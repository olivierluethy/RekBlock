<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>URL Blocker</title>
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Animate.css for animations -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <script src="popup.js" defer></script>
  </head>
  <body
    class="bg-light-subtle font-inter p-4 min-vh-100 d-flex flex-column"
    style="width: 400px"
  >
    <div
      class="d-flex justify-content-end mb-3 animate__animated animate__pulse animate__infinite animate__slow"
    >
      <button
        id="fullScreen"
        type="button"
        class="btn btn-primary btn-sm d-flex align-items-center shadow-sm transition-transform hover-scale"
        style="--bs-btn-hover-bg: #3b4cca"
      >
        <img
          src="full-screen.png"
          alt="Full Screen Icon"
          class="me-2"
          style="width: 18px; height: 18px; filter: brightness(0) invert(1)"
        />
        Full Screen
      </button>
    </div>

    <h1
      class="text-center fw-bold mb-4 text-primary animate__animated animate__slideInDown"
    >
      Block URL
    </h1>

    <div class="input-group mb-3 animate__animated animate__fadeInUp">
      <input
        type="text"
        id="urlInput"
        class="form-control rounded-start-3 shadow-sm"
        placeholder="Enter domain to block (e.g., example.com)"
        aria-label="Domain to block"
      />
      <button
        id="addButton"
        type="button"
        class="btn btn-primary rounded-end-3 shadow-sm transition-transform hover-scale"
        style="--bs-btn-hover-bg: #3b4cca"
      >
        Add
      </button>
    </div>

    <div
      class="text-center text-secondary small mb-3 animate__animated animate__fadeIn"
    >
      Add domains to block access to websites.
    </div>

    <ul
      id="blockedList"
      class="list-group overflow-auto"
      style="max-height: 300px"
    >
      <!-- Dynamically added <li> items here -->
    </ul>
  </body>
</html>
