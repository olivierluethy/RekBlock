<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>URL Blocker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <div class="header">
      <button id="fullScreen"><img src="full-screen.png" alt="">Full Screen</button>
    </div>
    <h1>Block URL</h1>
    <div class="input-container">
      <input type="text" id="urlInput" placeholder="Enter domain to block" />
      <button id="addButton">Add</button>
    </div>
    <div class="note">Add domains to block access.</div>
    <ul id="blockedList"></ul>
  </body>
</html>
