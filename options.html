<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Blocker Optionen</title>
  <link rel="stylesheet" href="style.css">
  <script src="options.js" defer></script>
</head>
<body>
  <h1>Zu blockierende Seiten festlegen</h1>
  <p>Gib die Domains ein, die blockiert werden sollen, getrennt durch Kommas.<br>
     Beispiel: <code>youtube, reddit, tiktok</code></p>
  <div class="input-container">
    <input type="text" id="domains" placeholder="youtube, reddit">
    <button id="save">Speichern</button>
  </div>
  <p id="status"></p>
  <div id="blocked-list">
    <h2>Gespeicherte Domains</h2>
    <ul id="domains-list"></ul>
  </div>
</body>
</html>
