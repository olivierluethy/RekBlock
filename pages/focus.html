<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="focus.js" defer></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .timer {
        font-size: 5rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 2px;
      }
      .phase-work {
        color: #dc2626;
      }
      .phase-break {
        color: #16a34a;
      }
      .phase-idle {
        color: var(--bs-secondary-color);
      }
      .ring {
        width: 260px;
        height: 260px;
      }
      .ring circle {
        transition: stroke-dashoffset 0.5s ease;
      }
    </style>
  </head>
  <body class="container py-4" style="max-width: 40rem">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="m-0">🍅 Focus Timer</h2>
      <a href="stats.html" class="btn btn-outline-secondary btn-sm">📊 Stats</a>
    </div>

    <div class="text-center mb-3 position-relative">
      <svg class="ring" viewBox="0 0 120 120">
        <circle
          cx="60"
          cy="60"
          r="54"
          fill="none"
          stroke="var(--bs-border-color)"
          stroke-width="8"
        />
        <circle
          id="progressRing"
          cx="60"
          cy="60"
          r="54"
          fill="none"
          stroke="#dc2626"
          stroke-width="8"
          stroke-linecap="round"
          stroke-dasharray="339.292"
          stroke-dashoffset="0"
          transform="rotate(-90 60 60)"
        />
      </svg>
      <div class="position-absolute top-50 start-50 translate-middle">
        <div id="phaseLabel" class="text-uppercase fw-semibold phase-idle mb-1">
          Idle
        </div>
        <div id="timer" class="timer phase-idle">00:00</div>
        <div id="cycleInfo" class="text-muted small"></div>
      </div>
    </div>

    <div id="setup" class="card mb-3">
      <div class="card-body">
        <label class="form-label fw-semibold">Choose a routine</label>
        <div class="row g-2 mb-3" id="routineButtons">
          <div class="col-6 col-md-3">
            <button class="btn btn-outline-primary w-100 routine-btn active" data-routine="pomodoro" data-work="25" data-break="5">Pomodoro<br /><small>25 / 5</small></button>
          </div>
          <div class="col-6 col-md-3">
            <button class="btn btn-outline-primary w-100 routine-btn" data-routine="50-10" data-work="50" data-break="10">50 / 10</button>
          </div>
          <div class="col-6 col-md-3">
            <button class="btn btn-outline-primary w-100 routine-btn" data-routine="90-15" data-work="90" data-break="15">90 / 15</button>
          </div>
          <div class="col-6 col-md-3">
            <button class="btn btn-outline-primary w-100 routine-btn" data-routine="custom">Custom</button>
          </div>
        </div>

        <div id="customFields" class="row g-2 mb-3 d-none">
          <div class="col">
            <label class="form-label small">Work (min)</label>
            <input type="number" id="customWork" class="form-control" value="25" min="1" max="180" />
          </div>
          <div class="col">
            <label class="form-label small">Break (min)</label>
            <input type="number" id="customBreak" class="form-control" value="5" min="1" max="60" />
          </div>
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="blockDuring" checked />
          <label class="form-check-label" for="blockDuring">
            Block all distraction categories during work phases
          </label>
        </div>

        <button id="startBtn" class="btn btn-primary w-100">▶ Start focus session</button>
      </div>
    </div>

    <div id="controls" class="d-none mb-3">
      <div class="d-flex gap-2">
        <button id="pauseBtn" class="btn btn-warning flex-grow-1">⏸ Pause</button>
        <button id="skipBtn" class="btn btn-outline-secondary flex-grow-1">⏭ Skip phase</button>
        <button id="stopBtn" class="btn btn-danger flex-grow-1">⏹ Stop</button>
      </div>
    </div>

    <div class="card">
      <div class="card-body text-center">
        <div class="row">
          <div class="col">
            <div class="fs-4 fw-bold" id="todaySessions">0</div>
            <div class="text-muted small">Sessions today</div>
          </div>
          <div class="col">
            <div class="fs-4 fw-bold" id="todayFocusMin">0</div>
            <div class="text-muted small">Focus minutes today</div>
          </div>
          <div class="col">
            <div class="fs-4 fw-bold" id="streak">0</div>
            <div class="text-muted small">Day streak</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
