<!-- routine.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Routines</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <script src="routine.js" defer></script>
</head>
<body class="container mt-4">
  <h3 id="domainTitle">Manage Routines for <span id="domainLabel"></span></h3>

  <div class="mt-3 mb-3">
    <label class="form-label">Redirect Instead of Block?</label>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="redirectToggle" />
      <label class="form-check-label" for="redirectToggle">Enable Redirect</label>
    </div>
    <input type="text" id="redirectUrlInput" class="form-control mt-2" placeholder="https://your-redirect-url.com" />
  </div>

  <hr />

  <h5>Defined Time Intervals</h5>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Days</th>
        <th>Time</th>
        <th>Enabled</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="routineTableBody"></tbody>
  </table>

  <button class="btn btn-primary" id="addRoutineBtn">➕ Add New Routine</button>

  <!-- Modal for adding/editing -->
  <div class="modal fade" id="routineModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content p-3">
        <h5 id="modalTitle">New Routine</h5>
        <div class="form-check form-check-inline">
          <label class="form-label me-2">Days:</label>
          <!-- repeat for all weekdays -->
          <input type="checkbox" class="form-check-input day-check" value="Mon" id="dayMon" /><label for="dayMon" class="me-2">Mon</label>
          <!-- ... -->
        </div>

        <div class="row mt-2">
          <div class="col">
            <label for="startTime" class="form-label">Start Time</label>
            <input type="time" id="startTime" class="form-control" />
          </div>
          <div class="col">
            <label for="endTime" class="form-label">End Time</label>
            <input type="time" id="endTime" class="form-control" />
          </div>
        </div>

        <div class="form-check mt-2">
          <input type="checkbox" class="form-check-input" id="enabledCheck" />
          <label class="form-check-label" for="enabledCheck">Enabled</label>
        </div>

        <div class="d-flex justify-content-end mt-3">
          <button class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-success" id="saveRoutineBtn">Save</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
