<!-- routine.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Schedule</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <script src="routine.js" defer></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Self-contained modal (no Bootstrap JS, blocked by MV3 CSP) */
      .rb-modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1050;
      }
      .rb-modal-backdrop.show {
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .rb-modal-dialog {
        background: var(--bs-body-bg, #fff);
        color: var(--bs-body-color, #212529);
        border-radius: 0.5rem;
        max-width: 32rem;
        width: 92%;
        margin-top: 6vh;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body class="container mt-4" style="max-width: 46rem">
    <h3 id="domainTitle">
      Schedule for <span id="domainLabel" class="text-primary"></span>
    </h3>

    <div
      id="statusBanner"
      class="alert alert-secondary d-flex align-items-center"
      role="status"
    >
      <span id="statusText">Loading status…</span>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <label class="form-label fw-semibold">Redirect instead of block?</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="redirectToggle" />
          <label class="form-check-label" for="redirectToggle"
            >Enable redirect (only during active time windows)</label
          >
        </div>
        <input
          type="text"
          id="redirectUrlInput"
          class="form-control mt-2"
          placeholder="https://your-redirect-url.com"
        />
      </div>
    </div>

    <h5>Defined time windows</h5>
    <p class="text-muted small">
      The site is blocked while any enabled window is active. Windows may cross
      midnight (e.g. 22:00 → 06:00).
    </p>
    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>Days</th>
          <th>Time</th>
          <th>Enabled</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody id="routineTableBody"></tbody>
    </table>

    <button class="btn btn-primary" id="addRoutineBtn">➕ Add time window</button>

    <!-- Modal for adding/editing (self-contained) -->
    <div class="rb-modal-backdrop" id="routineModal">
      <div class="rb-modal-dialog">
        <div class="p-3">
          <h5 id="modalTitle" class="mb-3">New time window</h5>

          <label class="form-label">Days</label>
          <div class="d-flex flex-wrap gap-2 mb-3" id="dayChecks">
            <!-- populated by JS -->
          </div>

          <div class="row">
            <div class="col">
              <label for="startTime" class="form-label">Start time</label>
              <input type="time" id="startTime" class="form-control" value="09:00" />
            </div>
            <div class="col">
              <label for="endTime" class="form-label">End time</label>
              <input type="time" id="endTime" class="form-control" value="17:00" />
            </div>
          </div>

          <div class="form-check mt-3">
            <input
              type="checkbox"
              class="form-check-input"
              id="enabledCheck"
              checked
            />
            <label class="form-check-label" for="enabledCheck">Enabled</label>
          </div>

          <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-secondary me-2" id="cancelRoutineBtn">
              Cancel
            </button>
            <button class="btn btn-success" id="saveRoutineBtn">Save</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
