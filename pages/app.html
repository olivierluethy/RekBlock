<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domain Blocker</title>

    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Animate.css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="shortcut icon" href="../logo.png" />
    <meta name="author" content="Olivier Luethy" />
    <script src="app.js" defer></script>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(145deg, #f8fafc, #e2e8f0);
      }

      .card-glass {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      .btn-primary {
        background-color: #3b82f6;
        border-color: #3b82f6;
      }

      .btn-primary:hover {
        background-color: #2563eb;
        border-color: #2563eb;
      }

      .btn-danger {
        background-color: #dc2626;
        border-color: #dc2626;
      }

      .btn-danger:hover {
        background-color: #b91c1c;
        border-color: #b91c1c;
      }

      .btn-secondary {
        background-color: #6b7280;
        border-color: #6b7280;
      }

      .btn-secondary:hover {
        background-color: #4b5563;
        border-color: #4b5563;
      }

      .routine-card {
        max-width: 800px;
        margin: 0 auto;
      }

      .weekday-checkboxes label {
        margin-right: 10px;
      }
    </style>
  </head>

  <body class="d-flex justify-content-center align-items-start p-4 min-vh-100">
    <main
      id="mainPage"
      class="container card-glass rounded-4 p-4"
      style="max-width: 32rem"
    >
      <header class="text-center mb-4">
        <h1
          class="fs-3 fw-bold text-dark animate__animated animate__slideInDown"
        >
          Domain Blocker
        </h1>
        <p
          class="text-muted fs-6 animate__animated animate__slideInDown"
          style="animation-delay: 0.1s"
        >
          Easily manage your blocked domains
        </p>
      </header>

      <section class="mb-4">
        <div
          class="input-group animate__animated animate__fadeIn"
          style="animation-delay: 0.2s"
        >
          <input
            type="text"
            id="urlInput"
            class="form-control rounded-start-3 shadow-sm"
            placeholder="Enter domain (e.g., example.com)"
            aria-label="Domain input"
          />
          <select id="blockType" class="form-select" style="max-width: 120px">
            <option value="block">Block</option>
            <option value="redirect">Redirect</option>
          </select>
          <input
            type="text"
            id="redirectUrl"
            class="form-control"
            placeholder="Redirect URL (optional)"
            style="display: none"
          />
          <button
            id="addButton"
            class="btn btn-primary rounded-end-3 shadow-sm"
          >
            Add
          </button>
        </div>
      </section>

      <section class="mb-4">
        <ul
          id="blockedList"
          class="list-group overflow-auto"
          style="max-height: 50vh"
          aria-live="polite"
        ></ul>
      </section>

      <footer class="text-center pt-3">
        <p class="text-muted fs-6">Developed & Designed by Olivier Lüthy</p>
      </footer>
    </main>

    <div
      id="routinePage"
      class="container card-glass rounded-4 p-4 d-none routine-card"
    >
      <header class="text-center mb-4">
        <h1 class="fs-3 fw-bold text-dark">
          Manage Routines for <span id="routineDomain"></span>
        </h1>
        <button id="backButton" class="btn btn-secondary mt-2">
          Back to Main
        </button>
      </header>

      <section class="mb-4">
        <h3>Add New Routine</h3>
        <div class="row g-3">
          <div class="col-md-3">
            <input type="time" id="startTime" class="form-control" />
          </div>
          <div class="col-md-3">
            <input type="time" id="endTime" class="form-control" />
          </div>
          <div class="col-md-6 weekday-checkboxes">
            <label><input type="checkbox" value="0" /> Sun</label>
            <label><input type="checkbox" value="1" /> Mon</label>
            <label><input type="checkbox" value="2" /> Tue</label>
            <label><input type="checkbox" value="3" /> Wed</label>
            <label><input type="checkbox" value="4" /> Thu</label>
            <label><input type="checkbox" value="5" /> Fri</label>
            <label><input type="checkbox" value="6" /> Sat</label>
          </div>
          <div class="col-12">
            <button id="addRoutineButton" class="btn btn-primary">
              Add Routine
            </button>
          </div>
        </div>
      </section>

      <section>
        <h3>Routines</h3>
        <ul id="routineList" class="list-group"></ul>
      </section>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
